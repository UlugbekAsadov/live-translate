[package]
name = "live-translate"
version = "0.1.0"
description = "Real-time AI meeting interpreter (English <-> Uzbek)"
edition = "2021"

[lib]
name = "live_translate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

cpal = "0.18"
voice_activity_detector = "0.2"

keyring = { version = "3", features = ["windows-native", "apple-native"] }
base64 = "0.22"

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
